# The computer's half of screen sync (pc/): a Windows .exe and a macOS menu-bar app, built on every push that touches
# it and put at fixed addresses, the "screensync-latest" release:
#   https://github.com/carnold713/caseta-hack/releases/download/screensync-latest/CasetaScreenSync.exe
#   https://github.com/carnold713/caseta-hack/releases/download/screensync-latest/CasetaScreenSync-mac.zip
# Both are native: a Win32 program (pc/windows) and a Swift app (pc/mac, for Apple silicon and Intel Macs), sharing
# the Settings page (pc/settings.html). Neither is signed by a developer account, so Windows and macOS each ask once
# before opening it (the README says how).
name: Screen sync for Windows and Mac

on:
  push:
    paths:
      - 'pc/**'
      - '.github/workflows/screensync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screensync-exe
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # the compiler from Visual Studio, on the PATH for the steps below
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Tests
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /std:c++17 /W3 /utf-8 /Fe:test_core.exe pc\windows\test_core.cpp || exit /b 1
          test_core.exe

      # native: Desktop Duplication shrunk by the graphics card, a Win32 tray icon, no runtime to carry
      - name: Build the .exe
        shell: cmd
        run: |
          python pc\windows\embed_page.py pc\settings.html pc\windows\page.h || exit /b 1
          mkdir dist
          cl /nologo /O2 /GL /MT /EHsc /std:c++17 /W3 /utf-8 /DUNICODE /D_UNICODE /Fe:dist\CasetaScreenSync.exe pc\windows\main.cpp /link /LTCG /SUBSYSTEM:WINDOWS d3d11.lib dxgi.lib ws2_32.lib psapi.lib shell32.lib user32.lib gdi32.lib advapi32.lib || exit /b 1
          dir dist

      # The runner has a desktop to look at; this proves the .exe starts, finds the displays, can grab the screen
      # through the graphics card, and what that costs
      - name: The .exe looks at the screen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CasetaScreenSync.exe -ArgumentList '--selftest' -RedirectStandardOutput selftest.txt -Wait -PassThru -NoNewWindow
          $out = (Get-Content selftest.txt, selftest.json -ErrorAction SilentlyContinue) -join ' '
          $out
          "::notice title=Windows selftest::$out"
          if ($p.ExitCode -ne 0) { exit 1 }

      # The tray app itself, left running for a while, with how much memory and processor it used
      - name: The .exe runs in the tray
        shell: pwsh
        run: |
          # a pretend connector beside it (pc/fake_connector.py): it has to be found, told the displays, sent frames
          $c = Start-Process -FilePath python -ArgumentList 'pc\fake_connector.py','30' -RedirectStandardOutput connector.txt -PassThru -NoNewWindow
          Start-Sleep -Seconds 1
          $p = Start-Process -FilePath dist\CasetaScreenSync.exe -ArgumentList '--pi','127.0.0.1' -PassThru
          Start-Sleep -Seconds 5
          # its Settings page answers, and a change from it is kept
          $url = (Select-String -Path "$env:LOCALAPPDATA\CasetaScreenSync\log.txt" -Pattern 'settings at (\S+)').Matches[0].Groups[1].Value
          $page = (Invoke-WebRequest -UseBasicParsing $url).Content
          $set = Invoke-RestMethod -Method Post ($url + 'set?b=' + [uri]::EscapeDataString('{"fps":30,"game":"full"}'))
          $kept = Get-Content "$env:APPDATA\CasetaScreenSync\settings.json" -Raw
          $settingsOk = $page.Contains('Light positions') -and $set.fps -eq 30 -and $set.game -eq 'full' -and $set.os -eq 'windows' -and $kept.Contains('"fps":30')
          "::notice title=Windows settings page::page $($page.Length) bytes, after a change: fps $($set.fps), game $($set.game), status '$($set.status)'; kept: $kept"
          Start-Sleep -Seconds 15
          $p.Refresh()
          $alive = -not $p.HasExited
          $cost = if ($alive) { "memory {0:N1} MB, processor {1:N2} s in 20 s" -f ($p.WorkingSet64 / 1MB), $p.TotalProcessorTime.TotalSeconds } else { "it stopped" }
          Stop-Process -Id $p.Id -ErrorAction SilentlyContinue
          $log = (Get-Content "$env:LOCALAPPDATA\CasetaScreenSync\log.txt" -ErrorAction SilentlyContinue) -join ' | '
          "::notice title=Windows tray run::$cost | $log"
          $c.WaitForExit()
          $heard = Get-Content connector.txt -Raw
          "::notice title=Windows to the connector::$heard"
          if (-not $alive -or -not $settingsOk -or $c.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: screensync-exe
          path: dist/CasetaScreenSync.exe

      - name: Publish to the screensync-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash pc/publish.sh dist/CasetaScreenSync.exe

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Tests
        run: |
          swiftc -O -swift-version 5 pc/mac/Core.swift pc/mac/tests/main.swift -o coretests
          ./coretests

      # the app's signing certificate, kept between builds so every update is the same app to macOS (pc/mac_sign.sh)
      - name: The signing certificate (kept in the cache)
        uses: actions/cache@v4
        with:
          path: ~/caseta-mac-sign.p12
          key: caseta-mac-sign-v1

      # native: ScreenCaptureKit shrunk by the graphics chip, a menu-bar item, nothing else to carry. One app for Apple
      # silicon and Intel Macs, with the identifier the earlier app had, so macOS keeps its Screen Recording permission.
      - name: Build the app
        env:
          CASETA_MAC_P12_B64: ${{ secrets.CASETA_MAC_P12_B64 }}
        run: |
          set -e
          APP=dist/CasetaScreenSync.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          for arch in arm64 x86_64; do
            swiftc -O -swift-version 5 -target $arch-apple-macos13.0 pc/mac/Core.swift pc/mac/main.swift -o build-$arch
          done
          lipo -create build-arm64 build-x86_64 -output "$APP/Contents/MacOS/CasetaScreenSync"
          cp pc/settings.html "$APP/Contents/Resources/"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>app.caseta.screensync</string>
            <key>CFBundleName</key><string>CasetaScreenSync</string>
            <key>CFBundleDisplayName</key><string>Caseta Screen Sync</string>
            <key>CFBundleExecutable</key><string>CasetaScreenSync</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>2.0</string>
            <key>CFBundleVersion</key><string>2.0</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>Caseta Screen Sync sends your screen's colours to the Caseta connector on your home network.</string>
          </dict></plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          bash pc/mac_sign.sh "$APP"
          ditto -c -k --keepParent "$APP" CasetaScreenSync-mac.zip
          ls -la "$APP/Contents/MacOS" CasetaScreenSync-mac.zip

      - name: The app looks at the screen
        run: |
          out=$(dist/CasetaScreenSync.app/Contents/MacOS/CasetaScreenSync --selftest)
          echo "$out"
          echo "::notice title=Mac selftest::$out"

      # The menu-bar app itself, left running for a while, with how much memory and processor it used
      - name: The app runs in the menu bar
        run: |
          python3 pc/fake_connector.py 30 > connector.txt &
          cpid=$!
          sleep 1
          dist/CasetaScreenSync.app/Contents/MacOS/CasetaScreenSync --pi 127.0.0.1 &
          pid=$!
          sleep 20
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          cost=$(ps -o rss=,time= -p $pid | awk '{printf "memory %.1f MB, processor %s in 20 s", $1/1024, $2}')
          kill $pid 2>/dev/null || true
          log=$(tr '\n' '|' < ~/Library/Logs/CasetaScreenSync/log.txt 2>/dev/null || true)
          echo "::notice title=Mac menu-bar run::alive $alive, $cost | $log"
          heard=0; wait $cpid && heard=1
          echo "::notice title=Mac to the connector::$(cat connector.txt)"
          test $alive = 1 && test $heard = 1

      - uses: actions/upload-artifact@v4
        with:
          name: screensync-mac
          path: CasetaScreenSync-mac.zip

      - name: Publish to the screensync-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash pc/publish.sh CasetaScreenSync-mac.zip
