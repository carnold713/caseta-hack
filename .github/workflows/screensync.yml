# The computer's half of screen sync (pc/): a Windows .exe and a macOS menu-bar app, built on every push that touches
# it and put at fixed addresses, the "screensync-latest" release:
#   https://github.com/carnold713/caseta-hack/releases/download/screensync-latest/CasetaScreenSync.exe
#   https://github.com/carnold713/caseta-hack/releases/download/screensync-latest/CasetaScreenSync-mac.zip
# The Mac app is for Apple silicon. Neither is signed by a developer account, so Windows and macOS each ask once
# before opening it (the README says how).
name: Screen sync for Windows and Mac

on:
  push:
    paths:
      - 'pc/**'
      - '.github/workflows/screensync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screensync-exe
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Install
        run: |
          python -m pip install -r pc/requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: python pc/test_screensync.py

      - name: Build the .exe
        run: pyinstaller --onefile --noconsole --name CasetaScreenSync --collect-all dxcam pc/screensync.py

      # The runner has a desktop to look at; this proves the .exe starts, imports everything and can grab the screen
      - name: The .exe looks at the screen once
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CasetaScreenSync.exe -ArgumentList '--selftest' -RedirectStandardOutput selftest.txt -Wait -PassThru -NoNewWindow
          Get-Content selftest.txt, selftest.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: screensync-exe
          path: dist/CasetaScreenSync.exe

      - name: Publish to the screensync-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash pc/publish.sh dist/CasetaScreenSync.exe

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pc/requirements.txt

      - name: Install
        run: |
          python -m pip install -r pc/requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Tests
        run: python pc/test_screensync.py

      # the app's signing certificate, kept between builds so every update is the same app to macOS (pc/mac_sign.sh)
      - name: The signing certificate (kept in the cache)
        uses: actions/cache@v4
        with:
          path: ~/caseta-mac-sign.p12
          key: caseta-mac-sign-v1

      # A menu-bar app: no Dock icon (LSUIElement), then signed (after the plist changes, which Apple silicon needs
      # before it will open it at all) with the same identity every build
      - name: Build the app
        env:
          CASETA_MAC_P12_B64: ${{ secrets.CASETA_MAC_P12_B64 }}
        run: |
          pyinstaller --windowed --name CasetaScreenSync --osx-bundle-identifier app.caseta.screensync pc/screensync.py
          plutil -insert LSUIElement -bool true dist/CasetaScreenSync.app/Contents/Info.plist
          bash pc/mac_sign.sh dist/CasetaScreenSync.app
          ditto -c -k --keepParent dist/CasetaScreenSync.app CasetaScreenSync-mac.zip

      - name: The app looks at the screen once
        run: dist/CasetaScreenSync.app/Contents/MacOS/CasetaScreenSync --selftest

      # The menu-bar app itself, left running for a while: the icon is redrawn every half second, which is where a
      # change made off the main thread brings macOS down on it
      - name: The app runs in the menu bar
        run: |
          dist/CasetaScreenSync.app/Contents/MacOS/CasetaScreenSync --pi 127.0.0.1 &
          pid=$!
          sleep 15
          alive=0; kill -0 $pid 2>/dev/null && alive=1
          kill $pid 2>/dev/null || true
          cat ~/Library/Logs/CasetaScreenSync/log.txt || true
          cat ~/Library/Logs/CasetaScreenSync/crash.txt 2>/dev/null || true
          test $alive = 1

      - uses: actions/upload-artifact@v4
        with:
          name: screensync-mac
          path: CasetaScreenSync-mac.zip

      - name: Publish to the screensync-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash pc/publish.sh CasetaScreenSync-mac.zip
